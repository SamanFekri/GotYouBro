# UMLFlow semantic facts.
# Entries with source "user" are declared by people and never overwritten.
# Entries with source "semantic-inference" were established once and are reused.

# UMLFlow semantic facts.
# Entries with source "user" were declared by people and are never overwritten.
# Entries with source "semantic-inference" were established once (e.g. by Claude) and are reused.
version: 1
components:
  routes@server/src/api/v1/app:
    actor: User
    source: semantic-inference
  routes@server/src/api/v1/backups:
    actor: External system
    source: semantic-inference
  BackupQueue:
    role: service
    source: semantic-inference
  HealthMonitor:
    role: service
    source: semantic-inference
  PartWriter:
    role: utility
    source: semantic-inference
  PartWriter@examples/python:
    role: utility
    source: semantic-inference
  RateLimiter:
    role: utility
    source: semantic-inference
  TelegramBackupDestination:
    role: gateway
    source: semantic-inference
actors:
  User:
    source: semantic-inference
  External system:
    source: semantic-inference
operations:
  routes@server/src/api/v1/backups.handleUpload:
    flow: Receive backup and queue Telegram delivery
    source: semantic-inference
  routes@server/src/api/v1/backups.respondWithBackup:
    flow: Return backup status to client
    source: semantic-inference
  routes@server/src/api/v1/app.meView:
    flow: Build signed-in user profile and limits
    source: semantic-inference
  routes@server/src/api/v1/app.uptimePercent:
    flow: Calculate service uptime percentage
    source: semantic-inference
  routes@server/src/api/v1/backups.readIdempotencyKey:
    flow: Validate Idempotency-Key header
    source: semantic-inference
  routes@server/src/api/v1/backups.assertContentLength:
    flow: Reject oversized upload by Content-Length
    source: semantic-inference
  routes@server/src/api/v1/backups.fileTooLarge:
    flow: Build file-too-large error
    source: semantic-inference
  routes@server/src/api/v1/backups.writeLimited:
    flow: Stream upload to temp file with size limit
    source: semantic-inference
  routes@server/src/api/v1/backups.safeDecode:
    flow: Decode uploaded file name
    source: semantic-inference
  routes@server/src/api/v1/backups.withTimeout:
    flow: Wait for delivery with timeout
    source: semantic-inference
entities: {}
